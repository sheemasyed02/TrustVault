# Render Blueprint for the TrustVault FastAPI API.
# Secrets are NOT embedded here — set them in the Render dashboard
# (Environment → Secret / Sync: false below).
#
# Frontend remains on Vercel; PostgreSQL on Neon; files on Cloudflare R2.
# Docs: README.md → Deployment

services:
  - type: web
    name: trustvault-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Render injects PORT. Bind all interfaces for the platform proxy.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ISSUER
        value: trustvault
      - key: JWT_AUDIENCE
        value: trustvault-api
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: CORS_ORIGINS
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      # Password reset (Brevo). Never put these in Vercel / frontend env.
      - key: FRONTEND_BASE_URL
        sync: false
      - key: PASSWORD_RESET_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: TrustVault
